<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Paper 33 Student Answer Sheet</title>
  <script src="https://cdn.jsdelivr.net/npm/mathlive"></script>
  <style>
    :root {
      --paper-width: 720px;
      --ink: #111827;
      --muted: #607086;
      --line: #d7dee8;
      --accent: #1457d9;
      --accent-2: #0f8a6a;
      --accent-soft: rgba(20, 87, 217, 0.1);
      --warm: #fff8e7;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    .student-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(17, 24, 39, 0.06);
    }
    .student-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .student-status {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .student-spacer { flex: 1; }
    button, .file-button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover, .file-button:hover { border-color: var(--accent); }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    main {
      width: min(100%, var(--paper-width));
      margin: 0 auto;
      padding: 12px 0 40px;
    }
    .paper-intro {
      display: none;
    }
    .question-row {
      width: 100%;
      max-width: var(--paper-width);
      margin: 0 auto;
      background: #fff;
      border: 0;
      border-radius: 0;
      overflow: visible;
      box-shadow: none;
    }
    .question-head {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #edf1f6;
      background: #fbfcfe;
      color: #4b5c72;
      font-size: 12px;
    }
    .tool-chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .tool-chip {
      border: 1px solid #d9e2ec;
      border-radius: 999px;
      padding: 3px 7px;
      background: #fff;
      color: #526377;
      font-size: 11px;
    }
    .question { width: 100%; margin: 0; padding: 0; }
    .block-shell { position: relative; width: 100%; margin: 0; }
    .block-shell + .block-shell { margin-top: 2px; }
    .surface-block { display: block; width: 100%; height: auto; background: #fff; }
    .answer-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    svg text { dominant-baseline: alphabetic; white-space: pre; }
    .slot-control {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
      pointer-events: auto;
      cursor: text;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      transform: translateY(-10px);
    }
    .slot-control.align-top { transform: none; align-items: flex-start; }
    .slot-control.full-text { transform: translateY(-10px); }
    .answer-mini,
    .answer-text,
    .answer-select {
      min-width: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #0f172a;
      outline: none;
      box-shadow: none;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.2;
    }
    .answer-mini {
      width: 58px;
      height: 24px;
      padding: 0 4px;
      font-size: 15px;
      text-align: center;
    }
    .answer-mini.wide { width: 98px; text-align: left; }
    .answer-mini.xwide { width: 142px; text-align: left; }
    .answer-text {
      width: 100%;
      height: 24px;
      padding: 0 4px;
      font-size: 15px;
    }
    .answer-text.reason { height: 24px; }
    .answer-select {
      height: 24px;
      padding: 0 4px;
      font-size: 15px;
    }
    .answer-mini::placeholder,
    .answer-text::placeholder,
    .answer-select::placeholder { color: transparent; }
    .answer-mini:focus::placeholder,
    .answer-text:focus::placeholder,
    .answer-select:focus::placeholder { color: rgba(96, 112, 134, 0.45); }
    .answer-mini:focus,
    .answer-text:focus,
    .answer-select:focus {
      border-bottom-color: transparent;
      background: transparent;
      box-shadow: none;
    }
    math-field.answer-math-field {
      display: block;
      width: 100%;
      min-width: 0;
      height: 24px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: #0f172a;
      padding: 0 4px;
      outline: none;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      line-height: 1.1;
      --caret-color: var(--accent);
      --selection-background-color: rgba(20, 87, 217, 0.16);
    }
    math-field.answer-math-field:focus-within {
      background: rgba(232, 240, 255, 0.9);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    math-field.answer-math-field::part(menu-toggle),
    math-field.answer-math-field::part(virtual-keyboard-toggle) {
      display: none !important;
    }
    .slot-control.formula-control {
      min-width: 86px;
      align-items: center;
    }
    .slot-control.formula-control .answer-text {
      width: 100%;
      min-width: 86px;
    }
    .unit-chip,
    .prefix-chip,
    .helper-chip {
      display: none;
      align-items: center;
      min-height: 0;
      padding: 0 2px;
      border-radius: 0;
      background: transparent;
      border: 0;
      color: #221f1f;
      font-size: 14px;
      white-space: nowrap;
    }
    .choice-wrap { display: flex; align-items: center; width: 100%; }
    .choice-wrap button {
      min-height: 26px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #fff;
    }
    .choice-wrap button.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
    .paper-choice { min-width: 96px; }
    .factor-boxes { display: flex; width: 100%; align-items: center; }
    .factor-line { min-width: 136px; }
    .fraction-box { display: inline-grid; grid-template-rows: 1fr auto 1fr; gap: 1px; align-items: center; }
    .fraction-box .answer-mini { width: 48px; height: 19px; }
    .frac-line { height: 1px; background: #334155; }
    .equation-builder { display: inline-flex; align-items: center; gap: 4px; }
    .visual-slot {
      position: absolute;
      z-index: 18;
      pointer-events: auto;
      transform: none;
    }
    .visual-slot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .visual-toolbar {
      position: absolute;
      left: calc(100% + 12px);
      top: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      width: 148px;
      max-width: min(148px, 40vw);
      padding: 6px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: none;
      opacity: 1;
      pointer-events: auto;
    }
    .visual-toolbar button {
      width: 100%;
      padding: 4px 6px;
      border-color: transparent;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      text-align: center;
    }
    .visual-toolbar button.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .visual-tooltip {
      max-width: 100%;
      padding: 0 2px 3px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #334155;
      font-size: 11px;
      line-height: 1.25;
      white-space: normal;
      box-shadow: none;
      opacity: 1;
      pointer-events: none;
      transform: none;
    }
    .draw-line { stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; fill: none; }
    .draw-point { fill: var(--accent); stroke: #fff; stroke-width: 1.4; }
    .radius-handle { fill: var(--accent); stroke: none; cursor: grab; opacity: 0; transition: opacity 100ms ease; }
    .radius-tool.show-radius-handle .radius-handle,
    .radius-tool.dragging-radius .radius-handle { opacity: 1; }
    .radius-handle:active { cursor: grabbing; }
    .radius-preview { stroke-dasharray: 4 3; opacity: 0.86; }
    .student-polygon { fill: rgba(20, 87, 217, 0.12); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
    .net-face { fill: rgba(15, 138, 106, 0.14); stroke: var(--accent-2); stroke-width: 2; stroke-linejoin: round; }
    .net-preview { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 4 3; stroke-linejoin: round; }
    .net-vertex { fill: var(--accent); stroke: #fff; stroke-width: 1.2; }
    .curve-path { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .pack-panel {
      position: absolute;
      right: 8px;
      top: 8px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px;
      padding: 2px 3px;
      border: 0;
      border-radius: 0;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: none;
      opacity: 0.72;
      pointer-events: auto;
      font-size: 12px;
    }
    .pack-panel:hover,
    .pack-panel:focus-within { opacity: 1; background: rgba(255, 255, 255, 0.96); }
    .pack-panel .answer-mini { width: 72px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 760px) {
      .student-bar { flex-wrap: wrap; }
      main { padding: 10px 8px 28px; }
      .question { padding: 4px 6px 10px; }
      .slot-control { gap: 3px; }
      .answer-mini { width: 50px; }
      .answer-mini.wide { width: 82px; }
      .answer-mini.xwide { width: 112px; }
      .choice-wrap button { padding: 4px 6px; }
      .visual-toolbar { gap: 4px; }
    }
    @media (hover: none) {
      .visual-toolbar {
        opacity: 0.72;
        pointer-events: auto;
      }
    }
    @media print {
      body { background: #fff; }
      .student-bar, .paper-intro { display: none; }
      main { width: 100%; padding: 0; }
      .question-row { border: none; box-shadow: none; margin-bottom: 0; border-radius: 0; }
      .question-head { display: none; }
      .answer-mini, .answer-text, .answer-select, math-field.answer-math-field { border-color: #000; box-shadow: none; }
      .visual-toolbar, .pack-panel { border-color: #000; box-shadow: none; }
    }
  </style>
</head>

      function hasBase(objects) {
        return objects.some(function(obj) { return obj.kind === 'base' || obj.kind === 'square'; });
      }
      function nextVertexCount(objects) {
        return hasBase(objects) ? 3 : 4;
      }
      function faceFrom(vertices, objects) {
        const kind = hasBase(objects) ? 'triangle' : 'base';
        return {
          type: 'net_face',
          kind: kind,
          vertices: vertices.slice(),
          points: vertices.map(pointFor)
        };
      }
      function renderVertex(vertex) {
        const p = pointFor(vertex);
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        attr(c, 'cx', p[0]); attr(c, 'cy', p[1]); attr(c, 'r', 3.2);
        c.classList.add('net-vertex');
        visual.svg.appendChild(c);
      }
      function storeNet(objects, draft, label) {
        storeAction(slot, spec, {
          objects: objects,
          draft_vertices: draft,
          interaction: 'select_grid_points'
        }, label);
      }
      function draw() {
        visual.svg.innerHTML = '';
        const act = actionFor(slot.id);
        (act.objects || []).forEach(function(obj) {
          const pts = pointsFor(obj);
          if (!pts.length) return;
          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          attr(poly, 'points', pts.map(function(p) { return p[0] + ',' + p[1]; }).join(' '));
          poly.classList.add('net-face');
          visual.svg.appendChild(poly);
        });
        const draft = act.draft_vertices || [];
        if (draft.length) {
          const points = draft.map(pointFor);
          const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          attr(polyline, 'points', points.map(function(p) { return p[0] + ',' + p[1]; }).join(' '));
          polyline.classList.add('net-preview');
          visual.svg.appendChild(polyline);
          draft.forEach(renderVertex);
        }
      }
      visual.div.addEventListener('pointerdown', function(event) {
        if (toolbar.contains(event.target)) return;
        const p = surfacePointFromEvent(event, visual.div, visual.viewBox);
        const snapped = snap(p);
        const act = actionFor(slot.id);
        const objects = (act.objects || []).slice();
        const draft = (act.draft_vertices || []).slice();
        if (sameVertex(draft[draft.length - 1], snapped)) return;
        draft.push(snapped);
        const needed = nextVertexCount(objects);
        if (draft.length >= needed) {
          objects.push(faceFrom(draft.slice(0, needed), objects));
          draft.length = 0;
          storeNet(objects, draft, 'Shape saved');
        } else {
          storeNet(objects, draft, 'Point saved');
        }
        draw();
      });
      undo.addEventListener('click', function(event) {
        event.stopPropagation();
        const act = actionFor(slot.id);
        const objects = (act.objects || []).slice();
        const draft = (act.draft_vertices || []).slice();
        if (draft.length) draft.pop();
        else objects.pop();
        storeNet(objects, draft, 'Undone'); draw();
      });
      clear.addEventListener('click', function(event) { event.stopPropagation(); delete state.actions[slot.id]; saveState('Cleared'); draw(); });
      draw();
    }
    function graphSurfaceToMath(p, graph) {
      return { x: Math.round((p.x - graph.ox) / graph.step), y: Math.round((graph.oy - p.y) / graph.step) };
    }
    function mathToSurface(pt, graph) {
      return [graph.ox + pt.x * graph.step, graph.oy - pt.y * graph.step];
    }
    function renderReflectionTool(slot, spec, view) {
      const visual = makeVisualSlot(slot, view, 'reflection-tool');
      const toolbar = visualToolbar('Click reflected vertices');
      const close = smallButton('Close shape');
      const undo = smallButton('Undo');
      const clear = smallButton('Clear');
      toolbar.appendChild(close); toolbar.appendChild(undo); toolbar.appendChild(clear);
      visual.div.appendChild(toolbar);
      function draw() {
        visual.svg.innerHTML = '';
        const points = actionFor(slot.id).points || [];
        if (points.length >= 2) {
          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          const list = points.concat(actionFor(slot.id).closed && points.length > 2 ? [points[0]] : []);
          attr(poly, 'points', list.map(function(pt) { const s = mathToSurface(pt, spec.graph); return s[0] + ',' + s[1]; }).join(' '));
          poly.classList.add('student-polygon');
          visual.svg.appendChild(poly);
        }
        points.forEach(function(pt) {
          const s = mathToSurface(pt, spec.graph);
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          attr(c, 'cx', s[0]); attr(c, 'cy', s[1]); attr(c, 'r', 4);
          c.classList.add('draw-point');
          visual.svg.appendChild(c);
        });
      }
      visual.div.addEventListener('pointerdown', function(event) {
        if (toolbar.contains(event.target)) return;
        const p = surfacePointFromEvent(event, visual.div, visual.viewBox);
        const math = graphSurfaceToMath(p, spec.graph);
        const points = (actionFor(slot.id).points || []).concat([math]);
        storeAction(slot, spec, { points: points, closed: false, objects: [{ type: 'polygon', vertices: points }] }, 'Vertex saved');
        draw();
      });
      close.addEventListener('click', function(event) { event.stopPropagation(); const points = actionFor(slot.id).points || []; storeAction(slot, spec, { points: points, closed: true, objects: [{ type: 'polygon', vertices: points, closed: true }] }, 'Shape closed'); draw(); });
      undo.addEventListener('click', function(event) { event.stopPropagation(); const points = (actionFor(slot.id).points || []).slice(0, -1); storeAction(slot, spec, { points: points, closed: false, objects: [{ type: 'polygon', vertices: points }] }, 'Undone'); draw(); });
      clear.addEventListener('click', function(event) { event.stopPropagation(); delete state.actions[slot.id]; saveState('Cleared'); draw(); });
      draw();
    }
    function renderFunctionGraph(slot, spec, view) {
      const visual = makeVisualSlot(slot, view, 'function-graph-tool');
      const toolbar = visualToolbar('Select points; curve is automatic');
      const undo = smallButton('Undo');
      const clear = smallButton('Clear');
      toolbar.appendChild(undo); toolbar.appendChild(clear);
      visual.div.appendChild(toolbar);
      function sortedCurve(points) {
        return points.slice().sort(function(a, b) {
          if (a.x !== b.x) return a.x - b.x;
          return a.y - b.y;
        });
      }
      function graphAction(points) {
        const curve = sortedCurve(points);
        return {
          points: points,
          curve: curve,
          objects: [
            { type: 'points', points: points },
            { type: 'auto_curve', points: curve }
          ]
        };
      }
      function draw() {
        visual.svg.innerHTML = '';
        const act = actionFor(slot.id);
        const points = act.points || act.curve || [];
        const curve = sortedCurve(points);
        if (curve.length >= 2) {
          const d = curvePath(curve.map(function(pt) { return mathToSurface(pt, spec.graph); }));
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          attr(path, 'd', d);
          path.classList.add('curve-path');
          visual.svg.appendChild(path);
        }
        points.forEach(function(pt) {
          const s = mathToSurface(pt, spec.graph);
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          attr(c, 'cx', s[0]); attr(c, 'cy', s[1]); attr(c, 'r', 3.6);
          c.classList.add('draw-point');
          visual.svg.appendChild(c);
        });
      }
      visual.div.addEventListener('pointerdown', function(event) {
        if (toolbar.contains(event.target)) return;
        const p = surfacePointFromEvent(event, visual.div, visual.viewBox);
        const math = graphSurfaceToMath(p, spec.graph);
        const act = actionFor(slot.id);
        const points = (act.points || []).slice();
        points.push(math);
        storeAction(slot, spec, graphAction(points), 'Point saved');
        draw();
      });
      undo.addEventListener('click', function(event) {
        event.stopPropagation();
        const act = actionFor(slot.id);
        const points = (act.points || []).slice();
        points.pop();
        storeAction(slot, spec, graphAction(points), 'Point removed');
        draw();
      });
      clear.addEventListener('click', function(event) { event.stopPropagation(); delete state.actions[slot.id]; saveState('Cleared'); draw(); });
      draw();
    }
    function curvePath(points) {
      if (!points.length) return '';
      if (points.length === 1) return 'M ' + points[0][0] + ' ' + points[0][1];
      let d = 'M ' + points[0][0] + ' ' + points[0][1];
      for (let i = 1; i < points.length; i += 1) {
        const prev = points[i - 1];
        const curr = points[i];
        const mx = (prev[0] + curr[0]) / 2;
        const my = (prev[1] + curr[1]) / 2;
        d += ' Q ' + prev[0] + ' ' + prev[1] + ' ' + mx + ' ' + my;
      }
      const last = points[points.length - 1];
      d += ' T ' + last[0] + ' ' + last[1];
      return d;
    }
    function renderSlot(slot, question, view) {
      const spec = SLOT_SPECS[slot.id];
      if (!spec) {
        console.warn('No specialized tool spec for slot', slot.id);
        return;
      }
      if (!intersectsCrop(slot.bbox || [0, 0, 0, 0], view.crop)) return;
      if (spec.tool === 'factor-list') return renderFactorList(slot, spec, view);
      if (spec.tool === 'choice-text' || spec.tool === 'transform-type') return renderChoiceText(slot, spec, view);
      if (spec.tool === 'fraction' || spec.tool === 'fraction-or-decimal') return renderFraction(slot, spec, view);
      if (spec.tool === 'equation-prefix' || spec.tool === 'algebra') return renderMathInput(slot, spec, view);
      if (spec.tool === 'reason' || spec.tool === 'reason-extra' || spec.tool === 'because' || spec.tool === 'calculation-line' || spec.tool === 'transform-detail') return renderReason(slot, spec, view);
      if (spec.tool === 'yes-no') return renderYesNo(slot, spec, view);
      if (spec.tool === 'packing-working') return renderPackingWorking(slot, spec, view);
      if (spec.tool === 'line-equation') return renderLineEquation(slot, spec, view);
      if (spec.tool === 'radius') return renderRadiusTool(slot, spec, view);
      if (spec.tool === 'pyramid-net') return renderNetTool(slot, spec, view);
      if (spec.tool === 'reflection-polygon') return renderReflectionTool(slot, spec, view);
      if (spec.tool === 'function-graph') return renderFunctionGraph(slot, spec, view);
      return renderSimpleInput(slot, spec, view);
    }
    function toolsForQuestion(question) {
      const labels = [];
      (question.answer_slots || []).forEach(function(rawSlot) {
        const slot = normalizedSlot(Object.assign({}, rawSlot, { question_id: question.id }));
        const spec = SLOT_SPECS[slot.id];
        if (spec && labels.indexOf(spec.label) === -1) labels.push(spec.label);
      });
      return labels.slice(0, 5);
    }
    function renderPaper() {
      (DATA.questions || []).forEach(function(question) {
        const row = document.createElement('section');
        row.className = 'question-row';
        row.setAttribute('aria-label', 'Paper item ' + question.number);
        const wrap = document.createElement('div');
        wrap.className = 'question';
        row.appendChild(wrap);
        (question.question_surface || []).forEach(function(block, blockIndex) { appendBlock(wrap, block, blockIndex); });
        streamEl.appendChild(row);
        (question.answer_slots || []).forEach(function(rawSlot) {
          const slot = normalizedSlot(Object.assign({}, rawSlot, { question_id: question.id }));
          const view = blockViews.get(slot.block_id);
          if (view) renderSlot(slot, question, view);
        });
      });
      updateProgress();
    }
    document.getElementById('clear-all').addEventListener('click', function() {
      if (!confirm('Clear all saved answers for this paper?')) return;
      state = { version: 2, exam: DATA.exam || {}, updated_at: null, answers: {}, actions: {} };
      localStorage.removeItem(storageKey);
      document.querySelectorAll('input').forEach(function(input) { if (input.type !== 'file') input.value = ''; });
      document.querySelectorAll('math-field.answer-math-field').forEach(function(field) { field.value = ''; });
      document.querySelectorAll('.choice-wrap button').forEach(function(button) { button.classList.remove('selected'); });
      document.querySelectorAll('.visual-slot svg').forEach(function(svg) { svg.innerHTML = ''; });
      updateProgress();
    });
    document.getElementById('export-answers').addEventListener('click', function() {
      saveState('Exported');
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = DATA.answer_export_filename || 'answers.json';
      a.click();
      URL.revokeObjectURL(url);
    });
    document.getElementById('import-answers').addEventListener('change', async function(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      state = JSON.parse(await file.text());
      localStorage.setItem(storageKey, JSON.stringify(state));
      location.reload();
    });
    renderPaper();
  </script>
